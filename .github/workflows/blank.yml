name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Gradle tasks
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD":/project \
            -w /project \
            -e GRADLE_USER_HOME=/project/.gradle-home \
            gradle:jdk17 gradle clean build --no-daemon

      - name: Show artifacts
        run: ls -la build/libs

      - name: Build Docker image
        run: docker build -t devops-app:latest .

      - name: Deploy container
        run: |
          docker stop devops-app || true
          docker rm devops-app || true
          docker run -d \
            --name devops-app \
            --restart unless-stopped \
            -p 8080:8080 \
            devops-app:latest

      - name: Integration test
        run: |
          expected=$(cat integration-test/health-expected.json)

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              break
            fi
            echo "Warte auf App... ($i/30)"
            sleep 2
          done

          actual=$(curl -sS http://localhost:8080/actuator/health)

          if [ "$expected" == "$actual" ]; then
            echo "Integrationstest OK"
            exit 0
          else
            echo "Integrationstest FEHLGESCHLAGEN"
            echo "Erwartet: $expected"
            echo "Bekommen: $actual"
            exit 1
          fi

      - name: Push image to registry
        run: |
          docker tag devops-app:latest 10.0.40.171:5000/team6/devops-app:latest
          docker tag devops-app:latest 10.0.40.171:5000/team6/devops-app:${GITHUB_SHA::7}
          docker push 10.0.40.171:5000/team6/devops-app:latest
          docker push 10.0.40.171:5000/team6/devops-app:${GITHUB_SHA::7}