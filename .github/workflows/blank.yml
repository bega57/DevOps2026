name: Build

on:
  push:
  workflow_dispatch:

env:
  REGISTRY_IMAGE: 10.0.40.171:5000/team6/devops-app
  SONAR_HOST_URL: http://10.0.40.168:9000

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build docs (HTML)
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD":/docs \
            squidfunk/mkdocs-material:9 build

      - name: Build docs (PDF)
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD":/data \
            pandoc/latex:3.6 \
            --metadata-file=docs-pdf.yaml \
            docs/index.md $(ls docs/lecture*.md | sort -V) \
            -o site/documentation.pdf

      - name: Copy PDF into app
        run: |
          mkdir -p src/main/resources/static
          cp site/documentation.pdf src/main/resources/static/

      - name: Gradle tasks
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD":/project \
            -w /project \
            -e GRADLE_USER_HOME=/project/.gradle-home \
            gradle:jdk17 gradle clean build --no-daemon

      - name: Show artifacts
        run: |
          ls -la build/libs
          ls -la build/reports/jacoco/test

      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          docker run --rm \
            -u $(id -u):$(id -g) \
            -v "$PWD":/usr/src \
            -e SONAR_HOST_URL \
            -e SONAR_TOKEN \
            -e SONAR_USER_HOME=/usr/src/.sonar \
            sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey=devops-app-team6 \
            -Dsonar.sources=src/main/java \
            -Dsonar.tests=src/test/java \
            -Dsonar.java.binaries=build/classes/java/main \
            -Dsonar.java.test.binaries=build/classes/java/test \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

      - name: Build Docker image
        run: docker build -t devops-app:$IMAGE_TAG .

      - name: Deploy container
        run: |
          docker stop devops-app || true
          docker rm devops-app || true
          docker run -d \
            --name devops-app \
            --restart unless-stopped \
            -p 8080:8080 \
            devops-app:$IMAGE_TAG

      - name: Integration test
        run: |
          expected=$(cat integration-test/health-expected.json)

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              break
            fi
            echo "Warte auf App... ($i/30)"
            sleep 2
          done

          actual=$(curl -sS http://localhost:8080/actuator/health)

          if [ "$expected" == "$actual" ]; then
            echo "Integrationstest OK"
            exit 0
          else
            echo "Integrationstest FEHLGESCHLAGEN"
            echo "Erwartet: $expected"
            echo "Bekommen: $actual"
            exit 1
          fi

      - name: Check PDF in app
        run: curl -sf -o /dev/null http://localhost:8080/documentation.pdf && echo "PDF OK"

      - name: Push image to registry
        run: |
          docker tag devops-app:$IMAGE_TAG $REGISTRY_IMAGE:$IMAGE_TAG
          docker push $REGISTRY_IMAGE:$IMAGE_TAG

      - name: Build docs image
        run: docker build -f Dockerfile.docs -t team6-docs:0.0.1 .

      - name: Deploy docs container
        run: |
          docker stop team6-docs || true
          docker rm team6-docs || true
          docker run -d \
            --name team6-docs \
            --restart unless-stopped \
            -p 8081:80 \
            team6-docs:0.0.1

      - name: Push docs image
        run: |
          docker tag team6-docs:0.0.1 10.0.40.171:5000/team6-docs:0.0.1
          docker push 10.0.40.171:5000/team6-docs:0.0.1

  deploy:
    runs-on: self-hosted
    needs: build
    env:
      PROD_HOST: 10.0.40.173
      PROD_USER: team6
    steps:
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Prepare SSH key and host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/ssh"
          echo "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_deploy"
          chmod 600 "$RUNNER_TEMP/ssh/id_deploy"
          ssh-keyscan -H $PROD_HOST > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy to production
        run: |
          SSH="ssh -i $RUNNER_TEMP/ssh/id_deploy -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts $PROD_USER@$PROD_HOST"

          # Lifecycle: alte Container und Images auf Produktion entfernen
          $SSH 'docker stop team6-app team6-docs || true'
          $SSH 'docker rm team6-app team6-docs || true'
          $SSH 'docker images -q team6-app | xargs -r docker rmi -f; docker rmi -f team6-docs:0.0.1 || true'

          # Images vom Build-Agent per SSH auf Produktion uebertragen
          docker tag devops-app:$IMAGE_TAG team6-app:$IMAGE_TAG
          docker save team6-app:$IMAGE_TAG | $SSH 'docker load'
          docker save team6-docs:0.0.1 | $SSH 'docker load'

          # Container auf Produktion starten
          $SSH "docker run -d --name team6-app --restart always -p 1861:8080 team6-app:$IMAGE_TAG"
          $SSH "docker run -d --name team6-docs --restart always -p 1862:80 team6-docs:0.0.1"

      - name: Check production
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://$PROD_HOST:1861/actuator/health > /dev/null; then
              echo "App auf Produktion OK"
              break
            fi
            echo "Warte auf App... ($i/30)"
            sleep 2
          done
          curl -sf http://$PROD_HOST:1861/actuator/health
          curl -sf -o /dev/null http://$PROD_HOST:1862 && echo "Doku auf Produktion OK"

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"